name: Run E-Commerce Project APIs Test

on: 
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '30 16 * * *'

jobs:
  run-api-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7.0.0

      - name: Setup Node.js Enviornment
        uses: actions/setup-node@v6.4.0

      - name: Install newman & newman-reporter-htmlextra
        run: |
          npm i -g newman
          npm i -g newman-reporter-htmlextra

      - name: Run E-Commerce APIs Project Postman Collection
        run: |
          newman run "E-Commerce APIs Project.postman_collection.json" \
          -e "QA-Environment (E-Commerce APIs Project).postman_environment" \
          -d "ecommerce_testdata.csv" \
          -r cli,htmlextra

      - name: Upload HTML APIs Test Reports
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: newman-html-report
          path: newman/*.html
